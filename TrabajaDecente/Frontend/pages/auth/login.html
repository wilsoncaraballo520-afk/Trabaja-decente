<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="/assets/js/tailwind-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<title>Iniciar sesión · Trabaja Decente</title>
</head>
<body data-page="login">
<div class="auth"><aside class="auth-side"><a class="brand" href="/" aria-label="Trabaja Decente"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="9" width="36" height="27" rx="7" fill="#fff"/><rect x="2" y="19" width="36" height="4" fill="#FDCB6E"/><rect x="17" y="17" width="6" height="8" rx="2" fill="#584FEA"/></svg><span><span class="brand-name">Trabaja<br>Decente</span><span class="brand-sub">Pascual Bravo</span></span></a>
<div><h2>Tu próximo trabajo empieza con una buena oportunidad.</h2><p>Ofertas para estudiantes de Pascual Bravo en el Área Metropolitana del Valle de Aburrá.</p></div><span></span></aside>
<main class="auth-main"><div class="auth-card">
  <h1>Bienvenido de nuevo</h1><p class="text-secondary">Inicia sesión para continuar.</p>
  <div class="alert alert-success" id="ok" hidden></div>
  <div class="alert alert-warning" id="warn" hidden></div>
  <form id="form" novalidate>
    <div class="seg" role="radiogroup" aria-label="Tipo de cuenta">
      <input type="radio" name="rol" id="r1" value="Estudiante" checked><label for="r1">Estudiante</label>
      <input type="radio" name="rol" id="r2" value="Empresa"><label for="r2">Empresa</label>
      <input type="radio" name="rol" id="r3" value="Administrador"><label for="r3">Administrador</label>
    </div>
    <div class="mb-3"><label class="form-label" for="correo">Correo electrónico</label><input class="form-control" id="correo" name="correo" type="email" autocomplete="username" required maxlength="254" placeholder="ejemplo@correo.com"></div>
    <div class="mb-3"><label class="form-label" for="pass">Contraseña</label><div class="pw-wrap"><input class="form-control" id="pass" name="contrasena" type="password" autocomplete="current-password" required maxlength="72"><button type="button" data-toggle-pass aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button></div></div>
    <div class="alert alert-danger py-2" id="err" hidden role="alert"></div>
    <button class="btn btn-primary w-100" id="submit">Iniciar sesión</button>
  </form>
  <p class="mt-3 text-center small text-secondary">¿No tienes cuenta? <a href="/pages/auth/registro-estudiante.html">Soy estudiante</a> · <a href="/pages/auth/registro-empresa.html">Soy empresa</a></p>
</div></main></div>
<script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
